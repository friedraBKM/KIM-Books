<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Must-Read-Regal – Seite nicht gefunden</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/turm.js"></script>
</head>
<body>
  <header class="kopf">
    <div class="wrap">
      <a class="marke" href="/"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect class="l-b1" x="4" y="8" width="7" height="19"></rect><rect class="l-band" x="4" y="11" width="7" height="2"></rect><rect class="l-b2" x="12" y="12" width="5" height="15"></rect><rect class="l-b3" x="19" y="9" width="5" height="18" transform="rotate(16 19 27)"></rect><rect class="l-regal" x="2" y="27" width="28" height="3"></rect></svg><b>MUST-READ-REGAL</b><span>KI Masterclass</span></a>
      <nav class="nav" aria-label="Hauptnavigation">
        <a href="/">Eintragen</a>
        <a href="/ergebnisse">Ergebnisse</a>
      </nav>
    </div>
  </header>

  <main class="wrap turm-seite">
    <div class="turm-geraet">
      <canvas id="turm" width="420" height="520" aria-label="Spiel Bücherturm: Bücher stapeln"></canvas>
      <div class="turm-leiste">
        <span>Höhe <b id="punkte">0</b></span>
        <span>Rekord <b id="rekord">0</b></span>
      </div>
    </div>

    <div class="turm-text">
      <div class="kicker" id="turm-kicker">Fehler 404</div>
      <h1 class="seitentitel" id="turm-titel">Diese Seite hat wohl eine KI halluziniert.</h1>
      <p id="turm-unter">Im Regal steht sie jedenfalls nicht. Stapel stattdessen ein paar Bücher.</p>
      <p class="neben klein">Tippen, klicken oder Leertaste: Buch fallen lassen. Was übersteht, fällt runter.</p>
      <div class="knoepfe">
        <a class="button voll" href="/">Zum Regal</a>
        <a class="button sekundaer" href="/ergebnisse">Ergebnisse</a>
      </div>
    </div>
  </main>
</body>
</html>
